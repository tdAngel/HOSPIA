services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: hospia, POSTGRES_PASSWORD: hospia, POSTGRES_DB: hospia }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospia"]
      interval: 3s
      retries: 15

  mailpit:            # bandeja de correo de desarrollo: http://localhost:8025
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://hospia:hospia@db:5432/hospia
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SECRET_KEY: dev-secret-cambiar-en-produccion-0123456789abcdef
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    depends_on: { db: { condition: service_healthy } }

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment: { VITE_PROXY_TARGET: "http://backend:8000" }
    ports: ["5173:5173"]
    volumes: ["./frontend:/app"]
    depends_on: [backend]

volumes:
  pgdata:
